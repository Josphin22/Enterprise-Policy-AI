services:
  # 1. PostgreSQL Database with Persistent Storage & Health Check
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_policy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EnterpriseSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enterprise_rag_network

  # 2. Production FastAPI Backend (ASGI with Uvicorn, non-root user)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_policy_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-EnterpriseSecurePass2026!}@postgres:5432/${POSTGRES_DB:-enterprise_rag}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - JWT_SECRET=${JWT_SECRET:-EnterprisePolicySecretTokenKey2026ChangeMeInProd}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@enterprise.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@Enterprise2026!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${WORKERS:-2}
      - ENABLE_GUARDRAILS=true
      - ENABLE_SENSITIVE_DATA_SCRUB=true
      - MAX_ANSWER_CHARACTERS=3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - document_storage:/app/documents
      - vector_storage:/app/vectorstore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      # Allows Linux and Windows containers to resolve host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - enterprise_rag_network

  # 3. Production Frontend (Nginx multi-stage build + Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_policy_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - enterprise_rag_network

  # 4. Optional Ollama Service Container (Run with: docker compose --profile with-ollama up)
  # When using host-installed Ollama, this container is omitted and host.docker.internal is used.
  ollama:
    image: ollama/ollama:latest
    container_name: enterprise_policy_ollama
    profiles: ["with-ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - enterprise_rag_network

volumes:
  postgres_data:
    driver: local
  document_storage:
    driver: local
  vector_storage:
    driver: local
  ollama_models:
    driver: local

networks:
  enterprise_rag_network:
    driver: bridge
